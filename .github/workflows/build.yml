# Builds the Windows installer, signs it for the built-in updater and publishes it as a release.
# Runs on every push to main; the release is named after the version in src-tauri/tauri.conf.json.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # "shared" build: small ffmpeg.exe / ffprobe.exe that share the codec DLLs
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            transcoder-rs

      # Everything the app needs at run time goes in src-tauri/resources (bundled by Tauri):
      #   resources/ffmpeg/      ffmpeg.exe, ffprobe.exe and their DLLs
      #   resources/transcoder/  televizion-transcoder.exe (built below)
      - name: Bundle ffmpeg
        shell: pwsh
        run: |
          $res = "src-tauri/resources"
          New-Item -ItemType Directory -Force "$res/transcoder", "$res/ffmpeg" | Out-Null
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe", "$($bin.FullName)/bin/ffprobe.exe" "$res/ffmpeg/"
          Copy-Item "$($bin.FullName)/bin/*.dll" "$res/ffmpeg/"
          Copy-Item "$($bin.FullName)/LICENSE.txt" "$res/ffmpeg/"
          Set-Content "$res/ffmpeg/README.txt" "ffmpeg.exe and ffprobe.exe are FFmpeg (https://ffmpeg.org), built by https://github.com/BtbN/FFmpeg-Builds and licensed under the GNU GPL v3 (see LICENSE.txt). Source code: https://github.com/FFmpeg/FFmpeg"

      - name: Test and build the transcoder
        shell: pwsh
        run: |
          $res = Resolve-Path "src-tauri/resources"
          $env:PATH = "$res\ffmpeg;$env:PATH"
          Push-Location transcoder-rs
          cargo test --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item transcoder-rs/target/release/televizion-transcoder.exe "$res/transcoder/"
          Get-ChildItem $res -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "bundled files: {0:N0} MB" -f ($_.Sum / 1MB) }

      - name: Install the Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Icons from the logo
        run: tauri icon logo.png

      # Builds the NSIS installer, signs it, creates the release "v<version>" and uploads the
      # installer plus latest.json (what installed apps read to know an update exists).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: tauri
          tagName: v__VERSION__
          releaseName: Televizion __VERSION__
          releaseBody: Windows installer. Installed apps update themselves from this release.
          releaseDraft: false
          prerelease: false

      # ── Real run on Windows ────────────────────────────────────────────────────────────────
      # Installs what was just built, starts it with port 3002 taken (the case that broke the
      # first version on a real PC), and converts a short piece of an open movie.
      - name: Install and run the app
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "installer: $($setup.Name)  {0:N1} MB" -f ($setup.Length / 1MB)
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\Televizion"
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $dir -Recurse | Select-Object FullName; throw "app not installed" }
          "installed: $($exe.FullName)"

          $busy = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 3002); $busy.Start()
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          $data = "$env:APPDATA\tv.televizion.desktop"
          "--- app.log"; Get-Content "$data\app.log"
          "--- transcoder.log (first lines)"; Get-Content "$data\transcoder.log" -TotalCount 25
          if ($app.HasExited) { throw "the app exited (code $($app.ExitCode))" }
          $m = Select-String -Path "$data\app.log" -Pattern 'transcoder at (http://127\.0\.0\.1:\d+)' | Select-Object -Last 1
          if (-not $m) { throw "the transcoder did not report an address" }
          $addr = $m.Matches[0].Groups[1].Value
          if ($addr -match ':3002$') { throw "expected another port than 3002 (it was taken)" }
          "transcoder answers at $addr"

          $headers = @{ Origin = 'http://televizion.tv' }
          $src = [uri]::EscapeDataString('http://televizion.tv/browse/demo/movie/demo/demo/202.mkv')
          "--- probe"
          $probe = Invoke-RestMethod "$addr/probe?url=$src" -Headers $headers -TimeoutSec 60
          $probe | ConvertTo-Json -Depth 3 -Compress | ForEach-Object { $_.Substring(0, [Math]::Min(600, $_.Length)) }
          "--- transcode"
          # same call as the web player: POST, live_start=1, the probe result as JSON body
          $body = @{ probe = $probe.probe } | ConvertTo-Json -Depth 12 -Compress
          $start = Invoke-RestMethod "$addr/transcode?url=$src&live_start=1&audio=0" -Method Post -Body $body -ContentType 'application/json' -Headers $headers -TimeoutSec 120
          $start | ConvertTo-Json -Compress
          if ($start.status -ne 'started') { throw "transcode did not start" }
          Start-Sleep -Seconds 8
          $playlist = (Invoke-WebRequest $start.playlist -Headers $headers -TimeoutSec 30 -UseBasicParsing).Content
          $playlist
          $segments = ($playlist -split "`n" | Where-Object { $_ -and $_ -notmatch '^#' }).Count
          if ($segments -lt 1) { throw "no segment in the playlist" }
          "segments so far: $segments"
          "--- encoders found"; Select-String -Path "$data\transcoder.log" -Pattern 'RESULT|hwaccel.*(FAILED|OK)' | Select-Object -Last 8 | ForEach-Object { $_.Line }

          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 8
          $left = Get-Process | Where-Object { $_.ProcessName -match 'televizion-transcoder|ffmpeg' }
          if ($left) { $left | Select-Object ProcessName, Id; throw "the transcoder or ffmpeg survived the app being killed" }
          "transcoder and ffmpeg stopped with the app"
          $busy.Stop()

  # Installs the PREVIOUS release, starts it, and checks that it updates itself to the version
  # built above. Skipped when there is no older release that knows TVZ_AUTO_UPDATE (1.2.1+).
  update-test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Previous release updates itself
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TVZ_AUTO_UPDATE: '1'
        run: |
          $tags = gh release list -R $env:GITHUB_REPOSITORY --limit 10 --json tagName,isLatest | ConvertFrom-Json
          $latest = ($tags | Where-Object isLatest).tagName
          $previous = ($tags | Where-Object { -not $_.isLatest } | Select-Object -First 1).tagName
          "latest: $latest   previous: $previous"
          if (-not $previous -or [version]($previous.TrimStart('v')) -lt [version]'1.2.1') { "no older release that can be tested: skipped"; exit 0 }
          gh release download $previous -R $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir old
          $setup = Get-ChildItem old/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\Televizion"
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          "installed $previous : $($exe.VersionInfo.ProductVersion)"
          Start-Process $exe.FullName
          $data = "$env:APPDATA\tv.televizion.desktop"
          $want = $latest.TrimStart('v')
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 6
            $now = (Get-Item $exe.FullName).VersionInfo.ProductVersion
            if ($now -like "$want*") { $ok = $true; break }
          }
          "--- app.log"; Get-Content "$data\app.log" -ErrorAction SilentlyContinue
          "installed version now: $((Get-Item $exe.FullName).VersionInfo.ProductVersion)  (wanted $want)"
          if (-not $ok) { throw "the app did not update itself" }
          Get-Process | Where-Object { $_.ProcessName -match '^televizion$' } | Stop-Process -Force -ErrorAction SilentlyContinue
